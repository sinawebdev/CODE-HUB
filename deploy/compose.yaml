name: koforlink

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      ENVIRONMENT: production
      SERVE_FRONTEND: "true"
      FRONTEND_DIR: /app/frontend
      MEDIA_ROOT: /var/lib/koforlink/media
    volumes:
      - media:/var/lib/koforlink/media
    expose:
      - "8000"

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your public domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  media:
  caddy_data:
  caddy_config:
